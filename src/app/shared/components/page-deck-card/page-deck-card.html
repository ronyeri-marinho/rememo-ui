<p-card class="max-w-sm w-full">
  <ng-template #header>
    <div class="card-header">
      <button pButton>
        <span class="material-symbols-rounded">{{ deck?.icon }}</span>
      </button>
      <h3 class="text-lg font-medium">{{ deck?.name }}</h3>
      <p>{{ deck?.description }}</p>
    </div>
  </ng-template>
  <ng-template #footer>
    <p-divider />
    <div class="card-footer">
      <span class="text-sm text-surface-500 dark:text-surface-400"
        >{{ deck?.cardsCount }} cartões</span
      >
      <button pButton iconOnly rounded variant="text" severity="contrast" aria-label="Star">
        <span class="material-symbols-rounded">open_in_new</span>
      </button>
    </div>
  </ng-template>
</p-card>
